name: CI pipeline frontend
on: 
    push:
        paths:
            - 'frontend/**'
            - '.github/workflows/frontend-ci-pipeline.yml'

defaults:
        run:
          working-directory: frontend

jobs:
      lint:
          runs-on: ubuntu-latest
          steps:
              - name: Checkout Code
                uses: actions/checkout@v4
              - name: Setup Node.js
                uses: actions/setup-node@v4
                with:
                  node-version: "22"
              - name: Install lint tooling
                run: npm install --no-save eslint
              - name: Lint and write report
                run: npx eslint src -f html -o lint-report.html
                continue-on-error: true
              - name: Upload lint report
                if: always()
                uses: actions/upload-artifact@v4
                with:
                  name: lint-report
                  path: frontend/lint-report.html
                  retention-days: 1
      testing:
        runs-on: ubuntu-latest
        needs: lint
        steps:
          - name: Checkout Code
            uses: actions/checkout@v4
          - name: Setup Node.js
            uses: actions/setup-node@v4
            with:
                  node-version: "22"
          - name: Install Playwright browsers
            run: npx playwright install --with-deps chromium
          - name: Run E2E tests
            run: npm run test:e2e
          - name: Upload Playwright report
            if: always()
            uses: actions/upload-artifact@v4
            with: 
              name:  playwright-report
              path: frontend/playwright-report/
              retention-days: 14
              