    <text x="108" y="624" font-size="13" fill="#333333">Our AI finds the real overlap between any two skills — grounded in actual job-market data, not a generic course mashup.</text>
    <text x="108" y="648" font-size="13" fill="#333333">market data, not a generic course mashup.</text>

