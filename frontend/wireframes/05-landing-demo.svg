    <text x="80" y="150" font-size="52" font-style="italic" font-weight="800" fill="#1F1F1F">Fuse your own skills</text>

    <!-- Demo card -->
    <rect x="160" y="200" width="1120" height="640" rx="28" fill="#FFFFFF" stroke="#1F1F1F" stroke-width="1.2"/>

    <!-- Skill chips group 1 -->
    <text x="220" y="260" font-size="11" font-weight="700" letter-spacing="1.5" fill="#666666">SKILL ONE</text>
    <g>
      <rect x="220" y="278" width="84" height="34" rx="17" fill="#1F1F1F"/><text x="262" y="299" text-anchor="middle" font-size="13" fill="#FFFFFF">Design</text>
      <rect x="312" y="278" width="66" height="34" rx="17" fill="#F4F4F4" stroke="#1F1F1F" stroke-width="0.8"/><text x="345" y="299" text-anchor="middle" font-size="13" fill="#1F1F1F">Code</text>
      <rect x="386" y="278" width="68" height="34" rx="17" fill="#F4F4F4" stroke="#1F1F1F" stroke-width="0.8"/><text x="420" y="299" text-anchor="middle" font-size="13" fill="#1F1F1F">Data</text>
