      <rect x="552" y="278" width="96" height="34" rx="17" fill="#F4F4F4" stroke="#1F1F1F" stroke-width="0.8"/><text x="600" y="299" text-anchor="middle" font-size="13" fill="#1F1F1F">Marketing</text>
      <rect x="656" y="278" width="64" height="34" rx="17" fill="#F4F4F4" stroke="#1F1F1F" stroke-width="0.8"/><text x="688" y="299" text-anchor="middle" font-size="13" fill="#1F1F1F">Sales</text>
      <rect x="728" y="278" width="44" height="34" rx="17" fill="#F4F4F4" stroke="#1F1F1F" stroke-width="0.8"/><text x="750" y="299" text-anchor="middle" font-size="13" fill="#1F1F1F">AI</text>
      <rect x="780" y="278" width="92" height="34" rx="17" fill="#F4F4F4" stroke="#1F1F1F" stroke-width="0.8"/><text x="826" y="299" text-anchor="middle" font-size="13" fill="#1F1F1F">Illustration</text>
      <rect x="880" y="278" width="78" height="34" rx="17" fill="#F4F4F4" stroke="#1F1F1F" stroke-width="0.8"/><text x="919" y="299" text-anchor="middle" font-size="13" fill="#1F1F1F">Product</text>
    </g>

    <!-- Skill chips group 2 -->
    <text x="220" y="370" font-size="11" font-weight="700" letter-spacing="1.5" fill="#666666">SKILL TWO</text>
    <g>
      <rect x="220" y="388" width="84" height="34" rx="17" fill="#F4F4F4" stroke="#1F1F1F" stroke-width="0.8"/><text x="262" y="409" text-anchor="middle" font-size="13" fill="#1F1F1F">Design</text>
      <rect x="312" y="388" width="66" height="34" rx="17" fill="#1F1F1F"/><text x="345" y="409" text-anchor="middle" font-size="13" fill="#FFFFFF">Code</text>
      <rect x="386" y="388" width="68" height="34" rx="17" fill="#F4F4F4" stroke="#1F1F1F" stroke-width="0.8"/><text x="420" y="409" text-anchor="middle" font-size="13" fill="#1F1F1F">Data</text>
      <rect x="462" y="388" width="82" height="34" rx="17" fill="#F4F4F4" stroke="#1F1F1F" stroke-width="0.8"/><text x="503" y="409" text-anchor="middle" font-size="13" fill="#1F1F1F">Writing</text>
      <rect x="552" y="388" width="96" height="34" rx="17" fill="#F4F4F4" stroke="#1F1F1F" stroke-width="0.8"/><text x="600" y="409" text-anchor="middle" font-size="13" fill="#1F1F1F">Marketing</text>
      <rect x="656" y="388" width="64" height="34" rx="17" fill="#F4F4F4" stroke="#1F1F1F" stroke-width="0.8"/><text x="688" y="409" text-anchor="middle" font-size="13" fill="#1F1F1F">Sales</text>
      <rect x="728" y="388" width="44" height="34" rx="17" fill="#F4F4F4" stroke="#1F1F1F" stroke-width="0.8"/><text x="750" y="409" text-anchor="middle" font-size="13" fill="#1F1F1F">AI</text>
      <rect x="780" y="388" width="92" height="34" rx="17" fill="#F4F4F4" stroke="#1F1F1F" stroke-width="0.8"/><text x="826" y="409" text-anchor="middle" font-size="13" fill="#1F1F1F">Illustration</text>
      <rect x="880" y="388" width="78" height="34" rx="17" fill="#F4F4F4" stroke="#1F1F1F" stroke-width="0.8"/><text x="919" y="409" text-anchor="middle" font-size="13" fill="#1F1F1F">Product</text>
