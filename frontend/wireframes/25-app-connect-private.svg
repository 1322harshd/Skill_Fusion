    <text x="424" y="696" font-size="11" fill="#888888">States → “awaiting peer” · “awaiting you (finalize)” · “exchange started”</text>

    <text x="128" y="790" font-size="12" fill="#888888">[Connect — private] 1:1 exchange, confirm-both-sides flow, report menu (⋯)</text>
