<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660">
  <g font-family="Helvetica, Arial, sans-serif">
    <rect width="1280" height="660" fill="#FFFFFF"/>

    <!-- APP SHELL HEADER (no active nav item) -->
    <circle cx="56" cy="52" r="24" fill="#FFFFFF" stroke="#1F1F1F" stroke-width="1.3"/>
    <text x="56" y="60" text-anchor="middle" font-size="20" font-style="italic" font-weight="800" fill="#1F1F1F">s</text>
    <rect x="320" y="30" width="640" height="46" rx="23" fill="#F4F4F4"/>
    <g>
      <rect x="343" y="46" width="14" height="14" rx="4" fill="none" stroke="#1F1F1F" stroke-width="1.2"/><text x="365" y="58" font-size="13" fill="#1F1F1F">Dashboard</text>
      <rect x="449" y="46" width="14" height="14" rx="4" fill="none" stroke="#1F1F1F" stroke-width="1.2"/><text x="471" y="58" font-size="13" fill="#1F1F1F">Fuse</text>
      <rect x="555" y="46" width="14" height="14" rx="4" fill="none" stroke="#1F1F1F" stroke-width="1.2"/><text x="577" y="58" font-size="13" fill="#1F1F1F">Roadmaps</text>
      <rect x="661" y="46" width="14" height="14" rx="4" fill="none" stroke="#1F1F1F" stroke-width="1.2"/><text x="683" y="58" font-size="13" fill="#1F1F1F">Log</text>
      <rect x="767" y="46" width="14" height="14" rx="4" fill="none" stroke="#1F1F1F" stroke-width="1.2"/><text x="789" y="58" font-size="13" fill="#1F1F1F">Resume</text>
      <rect x="873" y="46" width="14" height="14" rx="4" fill="none" stroke="#1F1F1F" stroke-width="1.2"/><text x="895" y="58" font-size="13" fill="#1F1F1F">Connect</text>
    </g>
    <rect x="1112" y="30" width="128" height="46" rx="23" fill="#F4F4F4"/>
    <circle cx="1138" cy="53" r="17" fill="#D9D9D9"/>
    <text x="1164" y="58" font-size="13" font-weight="600" fill="#1F1F1F">Ada</text>

    <!-- Step dots -->
    <g>
      <circle cx="560" cy="130" r="14" fill="#1F1F1F"/><text x="560" y="135" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">✓</text>
      <line x1="578" y1="130" x2="606" y2="130" stroke="#1F1F1F" stroke-width="1.5"/>
      <circle cx="620" cy="130" r="14" fill="#1F1F1F"/><text x="620" y="135" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">✓</text>
      <line x1="638" y1="130" x2="666" y2="130" stroke="#1F1F1F" stroke-width="1.5"/>
      <circle cx="680" cy="130" r="14" fill="#1F1F1F"/><text x="680" y="135" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">3</text>
    </g>

    <!-- Title -->
    <text x="640" y="220" text-anchor="middle" font-size="46" font-style="italic" font-weight="800" fill="#1F1F1F">Your first fusion</text>
    <text x="640" y="252" text-anchor="middle" font-size="14" fill="#555555">Pick two skills. We'll build the roadmap, the project, and your score from them.</text>

    <!-- Skill one -->
    <text x="420" y="292" font-size="11" font-weight="700" letter-spacing="1.5" fill="#666666">SKILL ONE</text>
    <rect x="392" y="304" width="496" height="52" rx="26" fill="#F7F7F7" stroke="#1F1F1F" stroke-width="1.2"/>
    <text x="420" y="336" font-size="14" fill="#888888">Pick a skill from any domain</text>

    <!-- orb -->
    <circle cx="640" cy="384" r="26" fill="#FFFFFF" stroke="#1F1F1F" stroke-width="1.5"/>
    <text x="640" y="392" text-anchor="middle" font-size="22" font-weight="800" fill="#1F1F1F">×</text>

    <!-- Skill two -->
    <text x="420" y="438" font-size="11" font-weight="700" letter-spacing="1.5" fill="#666666">SKILL TWO</text>
    <rect x="392" y="450" width="496" height="52" rx="26" fill="#F7F7F7" stroke="#1F1F1F" stroke-width="1.2"/>
    <text x="420" y="482" font-size="14" fill="#888888">Pick another skill from any domain</text>

    <!-- Begin -->
    <rect x="520" y="548" width="240" height="48" rx="24" fill="#1F1F1F"/>
    <text x="640" y="578" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">Begin my fusion</text>
  </g>
</svg>