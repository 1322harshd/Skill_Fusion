<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <g font-family="Helvetica, Arial, sans-serif">
    <rect width="1440" height="900" fill="#FFFFFF"/>

    <!-- Section heading -->
    <text x="100" y="80" font-size="48" font-style="italic" font-weight="800" fill="#1F1F1F">How rare is your combination?</text>

    <!-- Left side — big number -->
    <text x="100" y="250" font-size="96" font-style="italic" font-weight="800" fill="#1F1F1F">2.4%</text>
    <text x="100" y="290" font-size="14" fill="#666">of skill pairs are rarer than this one.</text>
    <text x="100" y="340" font-size="14" fill="#888">Fusion Score is computed from real job-market demand —</text>
    <text x="100" y="360" font-size="14" fill="#888">where your combination actually shows up in listings.</text>

    <!-- Right side — progress bar -->
    <text x="800" y="200" font-size="12" fill="#999">More common</text>
    <text x="1280" y="200" font-size="12" fill="#999">Rarer</text>
    <rect x="800" y="220" width="540" height="6" rx="3" fill="#F0F0F0"/>
    <rect x="800" y="220" width="520" height="6" rx="3" fill="#1F1F1F"/>
    <circle cx="1310" cy="223" r="8" fill="#1F1F1F"/>

    <!-- Metric chips -->
    <rect x="800" y="280" width="160" height="60" rx="14" fill="#FFF" stroke="#1F1F1F" stroke-width="1.5"/>
    <text x="820" y="310" font-size="18" font-style="italic" font-weight="700" fill="#1F1F1F">12,000+</text>
    <text x="820" y="328" font-size="11" fill="#888">Listings scanned</text>

    <rect x="980" y="280" width="160" height="60" rx="14" fill="#FFF" stroke="#1F1F1F" stroke-width="1.5"/>
    <text x="1000" y="310" font-size="18" font-style="italic" font-weight="700" fill="#1F1F1F">37%</text>
    <text x="1000" y="328" font-size="11" fill="#888">Pay delta vs. single skill</text>

    <rect x="1160" y="280" width="160" height="60" rx="14" fill="#FFF" stroke="#1F1F1F" stroke-width="1.5"/>
    <text x="1180" y="310" font-size="18" font-style="italic" font-weight="700" fill="#1F1F1F">+4.1%/yr</text>
    <text x="1180" y="328" font-size="11" fill="#888">Demand growth</text>

    <text x="60" y="870" font-size="11" fill="#999">[LOFI] Score — large percentage, progress bar, three metric chips</text>
  </g>
</svg>
