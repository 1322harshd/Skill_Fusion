<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <g font-family="Helvetica, Arial, sans-serif">
    <rect width="1440" height="900" fill="#FFFFFF"/>

    <!-- Section heading -->
    <text x="100" y="80" font-size="48" font-style="italic" font-weight="800" fill="#1F1F1F">Questions, answered</text>

    <!-- FAQ items -->
    <rect x="100" y="140" width="1240" height="65" rx="14" fill="#FFF" stroke="#1F1F1F" stroke-width="1.5"/>
    <text x="140" y="180" font-size="17" font-style="italic" font-weight="600" fill="#1F1F1F">What counts as a skill?</text>
    <text x="1320" y="180" text-anchor="end" font-size="18" fill="#999">+</text>

    <rect x="100" y="220" width="1240" height="65" rx="14" fill="#FFF" stroke="#1F1F1F" stroke-width="1.5"/>
    <text x="140" y="260" font-size="17" font-style="italic" font-weight="600" fill="#1F1F1F">Where does the Fusion Score come from?</text>
    <text x="1320" y="260" text-anchor="end" font-size="18" fill="#999">+</text>

    <rect x="100" y="300" width="1240" height="65" rx="14" fill="#FFF" stroke="#1F1F1F" stroke-width="1.5"/>
    <text x="140" y="340" font-size="17" font-style="italic" font-weight="600" fill="#1F1F1F">How long does a roadmap take?</text>
    <text x="1320" y="340" text-anchor="end" font-size="18" fill="#999">+</text>

    <rect x="100" y="380" width="1240" height="65" rx="14" fill="#FFF" stroke="#1F1F1F" stroke-width="1.5"/>
    <text x="140" y="420" font-size="17" font-style="italic" font-weight="600" fill="#1F1F1F">Do I need to be an expert first?</text>
    <text x="1320" y="420" text-anchor="end" font-size="18" fill="#999">+</text>

    <rect x="100" y="460" width="1240" height="65" rx="14" fill="#FFF" stroke="#1F1F1F" stroke-width="1.5"/>
    <text x="140" y="500" font-size="17" font-style="italic" font-weight="600" fill="#1F1F1F">Is my progress really verifiable?</text>
    <text x="1320" y="500" text-anchor="end" font-size="18" fill="#999">+</text>

    <rect x="100" y="540" width="1240" height="65" rx="14" fill="#FFF" stroke="#1F1F1F" stroke-width="1.5"/>
    <text x="140" y="580" font-size="17" font-style="italic" font-weight="600" fill="#1F1F1F">What if I want to change skills mid-roadmap?</text>
    <text x="1320" y="580" text-anchor="end" font-size="18" fill="#999">+</text>

    <text x="60" y="870" font-size="11" fill="#999">[LOFI] FAQ — six accordion items with + toggle icons</text>
  </g>
</svg>
