    <text x="430" y="175" text-anchor="middle" font-size="12" fill="#555">Self-reported</text>

    <!-- Timeline entries -->
    <line x1="100" y1="220" x2="100" y2="820" stroke="#EEE" stroke-width="1"/>

    <!-- Entry 1 -->
    <circle cx="100" cy="250" r="5" fill="#CCC"/>
    <rect x="130" y="220" width="1230" height="120" rx="14" fill="#FFF" stroke="#EEE" stroke-width="1"/>
    <rect x="160" y="245" width="120" height="24" rx="12" fill="#E5E5E5"/>
    <text x="220" y="262" text-anchor="middle" font-size="11" font-weight="600" fill="#555">Design × Code</text>
    <text x="160" y="300" font-size="16" font-style="italic" font-weight="600" fill="#1F1F1F">Built a Framer Motion component library</text>
    <text x="1300" y="260" text-anchor="end" font-size="11" fill="#999">Today</text>
    <rect x="160" y="315" width="70" height="22" rx="11" fill="#1F1F1F"/>
    <text x="195" y="330" text-anchor="middle" font-size="10" font-weight="600" fill="#FFF">Verified</text>

    <!-- Entry 2 -->
    <circle cx="100" cy="390" r="5" fill="#CCC"/>
    <rect x="130" y="360" width="1230" height="120" rx="14" fill="#FFF" stroke="#EEE" stroke-width="1"/>
    <rect x="160" y="385" width="120" height="24" rx="12" fill="#E5E5E5"/>
    <text x="220" y="402" text-anchor="middle" font-size="11" font-weight="600" fill="#555">Design × Code</text>
    <text x="160" y="440" font-size="16" font-style="italic" font-weight="600" fill="#1F1F1F">Shipped interactive prototype for client</text>
    <text x="1300" y="400" text-anchor="end" font-size="11" fill="#999">2 days ago</text>
    <rect x="160" y="455" width="80" height="22" rx="11" fill="#FFF" stroke="#CCC" stroke-width="1"/>
    <text x="200" y="470" text-anchor="middle" font-size="10" fill="#888">Pending</text>

    <!-- Entry 3 -->
    <circle cx="100" cy="530" r="5" fill="#CCC"/>
    <rect x="130" y="500" width="1230" height="120" rx="14" fill="#FFF" stroke="#EEE" stroke-width="1"/>
    <rect x="160" y="525" width="120" height="24" rx="12" fill="#E5E5E5"/>
    <text x="220" y="542" text-anchor="middle" font-size="11" font-weight="600" fill="#555">Design × Code</text>
    <text x="160" y="580" font-size="16" font-style="italic" font-weight="600" fill="#1F1F1F">Completed Week 5 — Design Tokens</text>
    <text x="1300" y="540" text-anchor="end" font-size="11" fill="#999">5 days ago</text>
    <rect x="160" y="595" width="100" height="22" rx="11" fill="#FFF" stroke="#DDD" stroke-width="1" stroke-dasharray="3"/>
    <text x="210" y="610" text-anchor="middle" font-size="10" fill="#999">◇ Self-reported</text>

    <!-- Entry 4 -->
    <circle cx="100" cy="670" r="5" fill="#CCC"/>
    <rect x="130" y="640" width="1230" height="120" rx="14" fill="#FFF" stroke="#EEE" stroke-width="1"/>
    <rect x="160" y="665" width="120" height="24" rx="12" fill="#E5E5E5"/>
    <text x="220" y="682" text-anchor="middle" font-size="11" font-weight="600" fill="#555">Design × Code</text>
    <text x="160" y="720" font-size="16" font-style="italic" font-weight="600" fill="#1F1F1F">GitHub sync — 12 commits, 3 PRs merged</text>
    <text x="1300" y="680" text-anchor="end" font-size="11" fill="#999">1 week ago</text>
    <rect x="160" y="735" width="70" height="22" rx="11" fill="#1F1F1F"/>
    <text x="195" y="750" text-anchor="middle" font-size="10" font-weight="600" fill="#FFF">Verified</text>

    <text x="60" y="870" font-size="11" fill="#999">[LOFI] Growth Log — timeline with 4 entries, filter pills, sync/add buttons, source badges</text>
  </g>
