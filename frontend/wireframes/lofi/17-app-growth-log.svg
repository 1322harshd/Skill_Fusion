<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <g font-family="Helvetica, Arial, sans-serif">
    <rect width="1440" height="900" fill="#FFFFFF"/>

    <!-- Top nav -->
    <rect width="1440" height="60" fill="#F8F8F8" stroke="#EEE" stroke-width="1"/>
    <circle cx="40" cy="30" r="18" fill="#E5E5E5"/>
    <text x="40" y="36" text-anchor="middle" font-size="14" font-style="italic" font-weight="800" fill="#666">s</text>
    <text x="400" y="36" font-size="13" font-weight="600" fill="#1F1F1F">Log</text>

    <!-- Title + actions -->
    <text x="80" y="120" font-size="42" font-style="italic" font-weight="800" fill="#1F1F1F">Growth Log</text>
    <rect x="1100" y="95" width="140" height="36" rx="18" fill="#F8F8F8" stroke="#CCC" stroke-width="1"/>
    <text x="1170" y="118" text-anchor="middle" font-size="13" fill="#555">Sync GitHub</text>
    <rect x="1260" y="95" width="140" height="36" rx="18" fill="#1F1F1F"/>
    <text x="1330" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="#FFF">Log something</text>

    <!-- Filter pills -->
    <rect x="80" y="155" width="80" height="30" rx="15" fill="#1F1F1F"/>
    <text x="120" y="175" text-anchor="middle" font-size="12" font-weight="600" fill="#FFF">All</text>
    <rect x="175" y="155" width="90" height="30" rx="15" fill="#F0F0F0" stroke="#CCC" stroke-width="1"/>
