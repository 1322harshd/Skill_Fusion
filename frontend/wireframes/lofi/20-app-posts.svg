<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <g font-family="Helvetica, Arial, sans-serif">
    <rect width="1440" height="900" fill="#FFFFFF"/>

    <!-- Top nav -->
    <rect width="1440" height="60" fill="#F8F8F8" stroke="#EEE" stroke-width="1"/>
    <circle cx="40" cy="30" r="18" fill="#E5E5E5"/>
    <text x="40" y="36" text-anchor="middle" font-size="14" font-style="italic" font-weight="800" fill="#666">s</text>
    <text x="400" y="36" font-size="13" font-weight="600" fill="#1F1F1F">Posts</text>

    <!-- Title -->
    <text x="80" y="120" font-size="42" font-style="italic" font-weight="800" fill="#1F1F1F">Auto Posts</text>

    <!-- Left sidebar — entry list -->
    <text x="80" y="170" font-size="11" fill="#999" letter-spacing="2">PICK AN ENTRY</text>
    <rect x="80" y="185" width="320" height="50" rx="12" fill="#1F1F1F"/>
    <text x="110" y="215" font-size="13" font-style="italic" fill="#FFF">Built a Framer Motion component library</text>
    <rect x="80" y="245" width="320" height="50" rx="12" fill="#F8F8F8" stroke="#EEE" stroke-width="1"/>
    <text x="110" y="275" font-size="13" font-style="italic" fill="#555">Shipped interactive prototype for client</text>
    <rect x="80" y="305" width="320" height="50" rx="12" fill="#F8F8F8" stroke="#EEE" stroke-width="1"/>
    <text x="110" y="335" font-size="13" font-style="italic" fill="#555">Completed Week 5 — Design Tokens</text>
    <rect x="80" y="365" width="320" height="50" rx="12" fill="#F8F8F8" stroke="#EEE" stroke-width="1"/>
    <text x="110" y="395" font-size="13" font-style="italic" fill="#555">GitHub sync — 12 commits, 3 PRs</text>
    <rect x="80" y="425" width="320" height="50" rx="12" fill="#F8F8F8" stroke="#EEE" stroke-width="1"/>
    <text x="110" y="455" font-size="13" font-style="italic" fill="#555">Explained Week 4 — Interaction Patterns</text>

    <!-- Right panel — draft editor -->
    <rect x="430" y="170" width="830" height="350" rx="18" fill="#F8F8F8" stroke="#1F1F1F" stroke-width="1.5"/>
    <text x="470" y="210" font-size="16" font-style="italic" font-weight="600" fill="#1F1F1F">Built a Framer Motion component library</text>
    <text x="1220" y="210" text-anchor="end" font-size="11" fill="#999">342 chars</text>

    <rect x="470" y="230" width="750" height="140" rx="10" fill="#FFF" stroke="#DDD" stroke-width="1"/>
    <text x="490" y="260" font-size="13" fill="#CCC">Just shipped a Framer Motion component library —</text>
    <text x="490" y="280" font-size="13" fill="#CCC">24 production-ready animation components that</text>
    <text x="490" y="300" font-size="13" fill="#CCC">3 product teams are now using. Design × Code</text>
    <text x="490" y="320" font-size="13" fill="#CCC">fusion in action.</text>

    <!-- Tone selector -->
    <text x="470" y="400" font-size="11" fill="#999" letter-spacing="2">TONE</text>
    <rect x="520" y="388" width="90" height="28" rx="14" fill="#F0F0F0" stroke="#CCC" stroke-width="1"/>
    <text x="565" y="407" text-anchor="middle" font-size="12" fill="#555">Professional</text>
    <rect x="620" y="388" width="70" height="28" rx="14" fill="#1F1F1F"/>
    <text x="655" y="407" text-anchor="middle" font-size="12" font-weight="600" fill="#FFF">Warm</text>
    <rect x="700" y="388" width="70" height="28" rx="14" fill="#F0F0F0" stroke="#CCC" stroke-width="1"/>
    <text x="735" y="407" text-anchor="middle" font-size="12" fill="#555">Punchy</text>

    <text x="1040" y="407" font-size="13" fill="#999">Draft again</text>
    <rect x="1120" y="388" width="80" height="28" rx="14" fill="#F8F8F8" stroke="#CCC" stroke-width="1"/>
    <text x="1160" y="407" text-anchor="middle" font-size="12" fill="#555">Queue</text>
    <rect x="1210" y="388" width="80" height="28" rx="14" fill="#1F1F1F"/>
    <text x="1250" y="407" text-anchor="middle" font-size="12" font-weight="600" fill="#FFF">Share</text>

    <!-- Post history -->
    <text x="430" y="560" font-size="11" fill="#999" letter-spacing="2">POST HISTORY</text>
    <rect x="430" y="575" width="830" height="50" rx="12" fill="#FFF" stroke="#EEE" stroke-width="1"/>
    <text x="460" y="605" font-size="13" fill="#555">Just shipped a Framer Motion component library...</text>
    <rect x="1200" y="590" width="60" height="22" rx="11" fill="#1F1F1F"/>
    <text x="1230" y="606" text-anchor="middle" font-size="10" font-weight="600" fill="#FFF">Shared</text>

    <rect x="430" y="635" width="830" height="50" rx="12" fill="#FFF" stroke="#EEE" stroke-width="1"/>
    <text x="460" y="665" font-size="13" fill="#555">Delivered a working prototype in 2 weeks...</text>
    <rect x="1190" y="650" width="70" height="22" rx="11" fill="#F0F0F0" stroke="#CCC" stroke-width="1"/>
    <text x="1225" y="666" text-anchor="middle" font-size="10" fill="#888">Queued</text>

    <text x="60" y="870" font-size="11" fill="#999">[LOFI] Posts — entry list sidebar, draft editor with tone selector, post history</text>
  </g>
</svg>
