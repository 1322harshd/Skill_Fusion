<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <g font-family="Helvetica, Arial, sans-serif">
    <rect width="1440" height="900" fill="#FFFFFF"/>

    <!-- Step dots -->
    <circle cx="660" cy="100" r="16" fill="#1F1F1F"/>
    <text x="660" y="106" text-anchor="middle" font-size="12" font-weight="600" fill="#FFF">01</text>
    <line x1="680" y1="100" x2="720" y2="100" stroke="#EEE" stroke-width="2"/>
    <circle cx="740" cy="100" r="16" fill="#F0F0F0" stroke="#CCC" stroke-width="1"/>
    <text x="740" y="106" text-anchor="middle" font-size="12" fill="#999">02</text>
    <line x1="760" y1="100" x2="800" y2="100" stroke="#EEE" stroke-width="2"/>
    <circle cx="820" cy="100" r="16" fill="#F0F0F0" stroke="#CCC" stroke-width="1"/>
    <text x="820" y="106" text-anchor="middle" font-size="12" fill="#999">03</text>

    <!-- Title -->
    <text x="720" y="200" text-anchor="middle" font-size="42" font-style="italic" font-weight="800" fill="#1F1F1F">What describes you?</text>
    <text x="720" y="235" text-anchor="middle" font-size="14" fill="#999">Pick every one that fits — we use this to shape your path.</text>

    <!-- Persona cards -->
    <rect x="400" y="280" width="640" height="60" rx="14" fill="#FFF" stroke="#1F1F1F" stroke-width="1.5"/>
    <text x="440" y="317" font-size="15" font-weight="500" fill="#1F1F1F">Self Learner</text>
    <text x="1000" y="317" text-anchor="end" font-size="16" fill="#1F1F1F">✓</text>

    <rect x="400" y="360" width="640" height="60" rx="14" fill="#FFF" stroke="#EEE" stroke-width="1"/>
    <text x="440" y="397" font-size="15" font-weight="500" fill="#555">Career Changer</text>

    <rect x="400" y="440" width="640" height="60" rx="14" fill="#FFF" stroke="#EEE" stroke-width="1"/>
    <text x="440" y="477" font-size="15" font-weight="500" fill="#555">Professional Expanding Expertise</text>

    <!-- Continue button -->
    <rect x="570" y="560" width="300" height="48" rx="24" fill="#1F1F1F"/>
    <text x="720" y="590" text-anchor="middle" font-size="14" font-weight="600" fill="#FFF">Continue</text>

    <text x="60" y="870" font-size="11" fill="#999">[LOFI] Onboarding Step 1 — step dots, persona selection cards, continue button</text>
  </g>
</svg>
