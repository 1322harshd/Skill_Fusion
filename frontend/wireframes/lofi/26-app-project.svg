<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <g font-family="Helvetica, Arial, sans-serif">
    <rect width="1440" height="900" fill="#FFFFFF"/>

    <!-- Top nav -->
    <rect width="1440" height="60" fill="#F8F8F8" stroke="#EEE" stroke-width="1"/>
    <circle cx="40" cy="30" r="18" fill="#E5E5E5"/>
    <text x="40" y="36" text-anchor="middle" font-size="14" font-style="italic" font-weight="800" fill="#666">s</text>
    <text x="400" y="36" font-size="13" font-weight="600" fill="#1F1F1F">Project</text>

    <!-- Project header card -->
    <rect x="80" y="100" width="1280" height="200" rx="20" fill="#F8F8F8" stroke="#1F1F1F" stroke-width="1.5"/>
    <rect x="120" y="130" width="160" height="30" rx="15" fill="#E5E5E5"/>
    <text x="200" y="150" text-anchor="middle" font-size="12" font-weight="600" fill="#555">Design × Code</text>
    <rect x="300" y="130" width="80" height="24" rx="12" fill="#1F1F1F"/>
    <text x="340" y="147" text-anchor="middle" font-size="11" font-weight="600" fill="#FFF">In progress</text>
    <text x="120" y="200" font-size="32" font-style="italic" font-weight="800" fill="#1F1F1F">The Design Engineer's Blueprint</text>

    <!-- Meta grid -->
    <text x="120" y="260" font-size="10" fill="#999" letter-spacing="2">CLIENT</text>
    <text x="120" y="280" font-size="13" fill="#555">Internal</text>
    <text x="350" y="260" font-size="10" fill="#999" letter-spacing="2">TIMELINE</text>
    <text x="350" y="280" font-size="13" fill="#555">10 weeks</text>
    <text x="580" y="260" font-size="10" fill="#999" letter-spacing="2">FORMAT</text>
    <text x="580" y="280" font-size="13" fill="#555">Component Library</text>
    <text x="810" y="260" font-size="10" fill="#999" letter-spacing="2">AUDIENCE</text>
    <text x="810" y="280" font-size="13" fill="#555">Product teams</text>

    <!-- Four info cards -->
    <rect x="80" y="330" width="620" height="130" rx="14" fill="#FFF" stroke="#EEE" stroke-width="1"/>
    <text x="120" y="360" font-size="11" fill="#999" letter-spacing="2">THE GOAL</text>
    <text x="120" y="390" font-size="13" fill="#555">Build a production-ready component library that</text>
    <text x="120" y="410" font-size="13" fill="#555">bridges design and engineering teams.</text>

    <rect x="720" y="330" width="640" height="130" rx="14" fill="#FFF" stroke="#EEE" stroke-width="1"/>
    <text x="760" y="360" font-size="11" fill="#999" letter-spacing="2">TOOLS & MATERIALS</text>
    <rect x="760" y="380" width="80" height="24" rx="12" fill="#F0F0F0"/>
    <text x="800" y="397" text-anchor="middle" font-size="11" fill="#555">React</text>
    <rect x="860" y="380" width="100" height="24" rx="12" fill="#F0F0F0"/>
    <text x="910" y="397" text-anchor="middle" font-size="11" fill="#555">TypeScript</text>
    <rect x="980" y="380" width="80" height="24" rx="12" fill="#F0F0F0"/>
    <text x="1020" y="397" text-anchor="middle" font-size="11" fill="#555">Figma</text>
    <rect x="1080" y="380" width="100" height="24" rx="12" fill="#F0F0F0"/>
    <text x="1130" y="397" text-anchor="middle" font-size="11" fill="#555">Framer Motion</text>

    <rect x="80" y="480" width="620" height="150" rx="14" fill="#FFF" stroke="#EEE" stroke-width="1"/>
    <text x="120" y="510" font-size="11" fill="#999" letter-spacing="2">DELIVERABLE</text>
    <text x="120" y="540" font-size="13" fill="#555">✓ 24 animation components</text>
    <text x="120" y="565" font-size="13" fill="#555">✓ Storybook documentation</text>
    <text x="120" y="590" font-size="13" fill="#555">✓ Design tokens package</text>

    <rect x="720" y="480" width="640" height="150" rx="14" fill="#FFF" stroke="#EEE" stroke-width="1"/>
    <text x="760" y="510" font-size="11" fill="#999" letter-spacing="2">EXPECTED OUTCOME</text>
    <text x="760" y="540" font-size="13" fill="#555">A library adopted by 3+ teams, reducing handoff</text>
    <text x="760" y="560" font-size="13" fill="#555">time by 40% and serving as a portfolio centerpiece.</text>

    <!-- Action buttons -->
    <rect x="80" y="660" width="200" height="40" rx="20" fill="#F8F8F8" stroke="#CCC" stroke-width="1"/>
    <text x="180" y="685" text-anchor="middle" font-size="13" fill="#555">Log a milestone</text>
    <text x="340" y="685" font-size="13" fill="#999">View Growth Log</text>
    <text x="520" y="685" font-size="13" fill="#999">Draft a post</text>

    <text x="60" y="870" font-size="11" fill="#999">[LOFI] Project — header card with meta, goal/tools/deliverables/outcome cards, action buttons</text>
  </g>
</svg>
