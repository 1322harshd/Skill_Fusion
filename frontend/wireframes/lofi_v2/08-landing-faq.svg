<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800">
  <g font-family="Helvetica, Arial, sans-serif" fill="none" stroke="#222" stroke-width="1.2">
    <rect width="1440" height="800" fill="#fff"/>
    <text x="720" y="80" text-anchor="middle" font-size="38" font-style="italic" font-weight="800" fill="#222" stroke="none">Questions, answered</text>
    <!-- FAQ items -->
    <rect x="200" y="130" width="1040" height="64" rx="16" fill="#f8f8f8" stroke="#bbb"/>
    <text x="240" y="168" font-size="16" font-style="italic" font-weight="600" fill="#222" stroke="none">What counts as a skill?</text>
    <text x="1200" y="168" font-size="18" fill="#999" stroke="none">+</text>
    <rect x="200" y="210" width="1040" height="64" rx="16" fill="#f8f8f8" stroke="#bbb"/>
    <text x="240" y="248" font-size="16" font-style="italic" font-weight="600" fill="#222" stroke="none">Where does the Fusion Score come from?</text>
    <text x="1200" y="248" font-size="18" fill="#999" stroke="none">+</text>
    <rect x="200" y="290" width="1040" height="64" rx="16" fill="#f8f8f8" stroke="#bbb"/>
    <text x="240" y="328" font-size="16" font-style="italic" font-weight="600" fill="#222" stroke="none">How long does a roadmap take?</text>
    <text x="1200" y="328" font-size="18" fill="#999" stroke="none">+</text>
    <rect x="200" y="370" width="1040" height="64" rx="16" fill="#f8f8f8" stroke="#bbb"/>
    <text x="240" y="408" font-size="16" font-style="italic" font-weight="600" fill="#222" stroke="none">Do I need to be an expert first?</text>
    <text x="1200" y="408" font-size="18" fill="#999" stroke="none">+</text>
    <rect x="200" y="450" width="1040" height="64" rx="16" fill="#f8f8f8" stroke="#bbb"/>
    <text x="240" y="488" font-size="16" font-style="italic" font-weight="600" fill="#222" stroke="none">Is my progress really verifiable?</text>
    <text x="1200" y="488" font-size="18" fill="#999" stroke="none">+</text>
    <rect x="200" y="530" width="1040" height="64" rx="16" fill="#f8f8f8" stroke="#bbb"/>
    <text x="240" y="568" font-size="16" font-style="italic" font-weight="600" fill="#222" stroke="none">What if I want to change skills mid-roadmap?</text>
    <text x="1200" y="568" font-size="18" fill="#999" stroke="none">+</text>
    <text x="40" y="760" font-size="11" fill="#999" stroke="none">[FAQ] 6 accordion items with + toggle, centered layout</text>
  </g>
</svg>
