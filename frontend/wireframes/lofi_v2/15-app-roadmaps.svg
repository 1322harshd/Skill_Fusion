<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000">
  <g font-family="Helvetica, Arial, sans-serif" fill="none" stroke="#222" stroke-width="1.2">
    <rect width="1440" height="1000" fill="#fff"/>
    <text x="80" y="80" font-size="36" font-style="italic" font-weight="800" fill="#222" stroke="none">Pick your outcome</text>
    <!-- Fusion selector -->
    <rect x="80" y="110" width="120" height="32" rx="16" fill="#222" stroke="none"/>
    <text x="140" y="131" text-anchor="middle" font-size="12" font-weight="600" fill="#fff" stroke="none">Design x Code</text>
    <rect x="210" y="110" width="120" height="32" rx="16" fill="#f0f0f0" stroke="#ccc"/>
    <text x="270" y="131" text-anchor="middle" font-size="12" fill="#222" stroke="none">Data x Writing</text>
    <!-- 3 roadmap preview cards -->
    <rect x="80" y="180" width="400" height="340" rx="20" fill="#f8f8f8" stroke="#bbb"/>
    <text x="110" y="220" font-size="18" font-style="italic" fill="#bbb" stroke="none">01</text>
    <rect x="300" y="200" width="60" height="24" rx="12" fill="#e0e0e0" stroke="#aaa"/>
    <text x="330" y="217" text-anchor="middle" font-size="11" font-weight="600" fill="#222" stroke="none">8 wks</text>
    <text x="110" y="270" font-size="20" font-style="italic" font-weight="700" fill="#222" stroke="none">The UI Engineer</text>
    <text x="110" y="295" font-size="20" font-style="italic" font-weight="700" fill="#222" stroke="none">Blueprint</text>
    <rect x="110" y="320" width="320" height="5" rx="2.5" fill="#ddd" stroke="none"/>
    <rect x="110" y="335" width="280" height="5" rx="2.5" fill="#ddd" stroke="none"/>
    <rect x="110" y="350" width="200" height="5" rx="2.5" fill="#ddd" stroke="none"/>
    <line x1="110" y1="380" x2="450" y2="380" stroke="#eee" stroke-width="1"/>
    <rect x="110" y="400" width="320" height="40" rx="20" fill="#222" stroke="none"/>
    <text x="270" y="425" text-anchor="middle" font-size="13" font-weight="600" fill="#fff" stroke="none">Choose this path</text>

    <rect x="520" y="180" width="400" height="340" rx="20" fill="#f8f8f8" stroke="#bbb"/>
    <text x="550" y="220" font-size="18" font-style="italic" fill="#bbb" stroke="none">02</text>
    <rect x="740" y="200" width="60" height="24" rx="12" fill="#e0e0e0" stroke="#aaa"/>
    <text x="770" y="217" text-anchor="middle" font-size="11" font-weight="600" fill="#222" stroke="none">6 wks</text>
    <text x="550" y="270" font-size="20" font-style="italic" font-weight="700" fill="#222" stroke="none">Creative Technologist</text>
    <rect x="550" y="320" width="320" height="5" rx="2.5" fill="#ddd" stroke="none"/>
    <rect x="550" y="335" width="280" height="5" rx="2.5" fill="#ddd" stroke="none"/>
    <rect x="550" y="350" width="240" height="5" rx="2.5" fill="#ddd" stroke="none"/>
    <line x1="550" y1="380" x2="890" y2="380" stroke="#eee" stroke-width="1"/>
    <rect x="550" y="400" width="320" height="40" rx="20" fill="#222" stroke="none"/>
    <text x="710" y="425" text-anchor="middle" font-size="13" font-weight="600" fill="#fff" stroke="none">Choose this path</text>

    <rect x="960" y="180" width="400" height="340" rx="20" fill="#f8f8f8" stroke="#bbb"/>
    <text x="990" y="220" font-size="18" font-style="italic" fill="#bbb" stroke="none">03</text>
    <rect x="1180" y="200" width="60" height="24" rx="12" fill="#e0e0e0" stroke="#aaa"/>
    <text x="1210" y="217" text-anchor="middle" font-size="11" font-weight="600" fill="#222" stroke="none">10 wks</text>
    <text x="990" y="270" font-size="20" font-style="italic" font-weight="700" fill="#222" stroke="none">Product Builder</text>
    <rect x="990" y="320" width="320" height="5" rx="2.5" fill="#ddd" stroke="none"/>
    <rect x="990" y="335" width="280" height="5" rx="2.5" fill="#ddd" stroke="none"/>
    <rect x="990" y="350" width="180" height="5" rx="2.5" fill="#ddd" stroke="none"/>
    <line x1="990" y1="380" x2="1330" y2="380" stroke="#eee" stroke-width="1"/>
    <rect x="990" y="400" width="320" height="40" rx="20" fill="#222" stroke="none"/>
    <text x="1150" y="425" text-anchor="middle" font-size="13" font-weight="600" fill="#fff" stroke="none">Choose this path</text>

    <!-- Regenerate -->
    <text x="620" y="580" font-size="13" fill="#888" stroke="none">None of these fit?</text>
    <rect x="740" y="560" width="240" height="40" rx="20" fill="#f0f0f0" stroke="#bbb"/>
    <text x="860" y="585" text-anchor="middle" font-size="13" fill="#222" stroke="none">Show me different options</text>
    <text x="40" y="960" font-size="11" fill="#999" stroke="none">[Roadmaps] 3 roadmap preview cards + fusion selector + regenerate</text>
  </g>
</svg>
