<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000">
  <g font-family="Helvetica, Arial, sans-serif" fill="none" stroke="#222" stroke-width="1.2">
    <rect width="1440" height="1000" fill="#fff"/>
    <!-- Header -->
    <rect x="80" y="60" width="120" height="28" rx="14" fill="#e0e0e0" stroke="#aaa"/>
    <text x="140" y="79" text-anchor="middle" font-size="12" font-weight="600" fill="#222" stroke="none">Design x Code</text>
    <text x="80" y="120" font-size="36" font-style="italic" font-weight="800" fill="#222" stroke="none">Fusion Score</text>
    <!-- Fusion selector -->
    <rect x="80" y="140" width="120" height="32" rx="16" fill="#222" stroke="none"/>
    <text x="140" y="161" text-anchor="middle" font-size="12" font-weight="600" fill="#fff" stroke="none">Design x Code</text>

    <!-- Gauge -->
    <circle cx="260" cy="300" r="100" fill="#f0f0f0" stroke="#ddd" stroke-width="1"/>
    <circle cx="260" cy="300" r="80" fill="#fff" stroke="none"/>
    <text x="260" y="310" text-anchor="middle" font-size="48" font-style="italic" font-weight="800" fill="#222" stroke="none">87</text>
    <text x="260" y="335" text-anchor="middle" font-size="11" font-weight="600" fill="#888" stroke="none">SCORE</text>
    <text x="260" y="430" text-anchor="middle" font-size="11" fill="#aaa" stroke="none">weights: rarity 45% - demand 55%</text>

    <!-- Signal bars -->
    <text x="500" y="200" font-size="14" font-weight="600" fill="#222" stroke="none">Rarity signal</text>
    <text x="1200" y="200" font-size="16" font-style="italic" fill="#222" stroke="none">High</text>
    <rect x="500" y="215" width="740" height="8" rx="4" fill="#e0e0e0" stroke="none"/>
    <rect x="500" y="215" width="600" height="8" rx="4" fill="#222" stroke="none"/>
    <rect x="500" y="235" width="600" height="4" rx="2" fill="#ddd" stroke="none"/>
    <rect x="500" y="247" width="500" height="4" rx="2" fill="#ddd" stroke="none"/>

    <text x="500" y="310" font-size="14" font-weight="600" fill="#222" stroke="none">Demand signal</text>
    <text x="1200" y="310" font-size="16" font-style="italic" fill="#222" stroke="none">Strong</text>
    <rect x="500" y="325" width="740" height="8" rx="4" fill="#e0e0e0" stroke="none"/>
    <rect x="500" y="325" width="660" height="8" rx="4" fill="#222" stroke="none"/>
    <rect x="500" y="345" width="600" height="4" rx="2" fill="#ddd" stroke="none"/>
    <rect x="500" y="357" width="450" height="4" rx="2" fill="#ddd" stroke="none"/>

    <line x1="500" y1="390" x2="1360" y2="390" stroke="#eee" stroke-width="1"/>
    <rect x="500" y="410" width="700" height="4" rx="2" fill="#ddd" stroke="none"/>
    <rect x="500" y="422" width="600" height="4" rx="2" fill="#ddd" stroke="none"/>

    <!-- Next step card -->
    <rect x="80" y="480" width="1280" height="120" rx="20" fill="#f0f0f0" stroke="#bbb"/>
    <text x="120" y="515" font-size="11" font-weight="600" fill="#888" stroke="none">NATURAL NEXT STEP</text>
    <text x="120" y="545" font-size="18" font-style="italic" font-weight="600" fill="#222" stroke="none">Add React to lift your score to 92</text>
    <rect x="1200" y="520" width="120" height="40" rx="20" fill="#222" stroke="none"/>
    <text x="1260" y="545" text-anchor="middle" font-size="13" font-weight="600" fill="#fff" stroke="none">Add React</text>

    <!-- Score history -->
    <rect x="80" y="630" width="1280" height="140" rx="20" fill="#f8f8f8" stroke="#bbb"/>
    <text x="120" y="665" font-size="11" font-weight="600" fill="#888" stroke="none">SCORE HISTORY</text>
    <rect x="120" y="685" width="1200" height="50" rx="6" fill="#e8e8e8" stroke="#ccc"/>
    <polyline points="140,720 200,715 260,710 320,705 380,700 440,695 500,690 560,685 620,682 680,680 740,678 800,675 860,672 920,670 980,668 1040,665 1100,662 1160,660 1220,658 1280,655" fill="none" stroke="#999" stroke-width="1.5"/>
    <text x="120" y="760" font-size="11" fill="#aaa" stroke="none">6 weeks ago</text>
    <text x="1300" y="760" font-size="11" fill="#aaa" stroke="none">today</text>

    <text x="40" y="960" font-size="11" fill="#999" stroke="none">[Score] Gauge + rarity/demand bars + next step card + history sparkline</text>
  </g>
</svg>
