<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000">
  <g font-family="Helvetica, Arial, sans-serif" fill="none" stroke="#222" stroke-width="1.2">
    <rect width="1440" height="1000" fill="#fff"/>
    <text x="80" y="80" font-size="36" font-style="italic" font-weight="800" fill="#222" stroke="none">Auto Posts</text>
    <!-- Left: Entry list -->
    <text x="80" y="130" font-size="11" font-weight="600" fill="#888" stroke="none">PICK AN ENTRY</text>
    <rect x="80" y="145" width="320" height="56" rx="14" fill="#222" stroke="none"/>
    <text x="100" y="170" font-size="13" font-style="italic" font-weight="600" fill="#fff" stroke="none">Shipped the component library</text>
    <text x="100" y="190" font-size="10" fill="#aaa" stroke="none">Today</text>
    <rect x="80" y="210" width="320" height="56" rx="14" fill="#f8f8f8" stroke="#bbb"/>
    <text x="100" y="235" font-size="13" font-style="italic" fill="#222" stroke="none">Completed Week 3</text>
    <rect x="80" y="275" width="320" height="56" rx="14" fill="#f8f8f8" stroke="#bbb"/>
    <text x="100" y="300" font-size="13" font-style="italic" fill="#222" stroke="none">GitHub sync - 12 contributions</text>
    <rect x="80" y="340" width="320" height="56" rx="14" fill="#f8f8f8" stroke="#bbb"/>
    <text x="100" y="365" font-size="13" font-style="italic" fill="#222" stroke="none">Self-assessed React level</text>

    <!-- Right: Draft area -->
    <rect x="440" y="130" width="920" height="420" rx="24" fill="#f0f0f0" stroke="#bbb"/>
    <text x="480" y="175" font-size="16" font-style="italic" font-weight="600" fill="#222" stroke="none">Shipped the component library</text>
    <text x="1280" y="175" font-size="11" fill="#aaa" stroke="none">412 chars</text>
    <rect x="480" y="200" width="840" height="140" rx="12" fill="#fff" stroke="#ddd"/>
    <text x="500" y="230" font-size="13" fill="#aaa" stroke="none">Draft post text...</text>
    <!-- Tone chips -->
    <text x="480" y="370" font-size="11" font-weight="600" fill="#888" stroke="none">TONE</text>
    <rect x="530" y="355" width="80" height="28" rx="14" fill="#f0f0f0" stroke="#ccc"/>
    <text x="570" y="374" text-anchor="middle" font-size="11" fill="#222" stroke="none">Professional</text>
    <rect x="620" y="355" width="60" height="28" rx="14" fill="#222" stroke="none"/>
    <text x="650" y="374" text-anchor="middle" font-size="11" font-weight="600" fill="#fff" stroke="none">Warm</text>
    <rect x="690" y="355" width="60" height="28" rx="14" fill="#f0f0f0" stroke="#ccc"/>
    <text x="720" y="374" text-anchor="middle" font-size="11" fill="#222" stroke="none">Punchy</text>
    <!-- Actions -->
    <text x="1060" y="374" font-size="13" fill="#888" stroke="none">Draft again</text>
    <rect x="1140" y="355" width="80" height="32" rx="16" fill="#f0f0f0" stroke="#bbb"/>
    <text x="1180" y="376" text-anchor="middle" font-size="12" fill="#222" stroke="none">Queue</text>
    <rect x="1230" y="355" width="100" height="32" rx="16" fill="#222" stroke="none"/>
    <text x="1280" y="376" text-anchor="middle" font-size="12" font-weight="600" fill="#fff" stroke="none">Share</text>

    <!-- Post history -->
    <text x="80" y="600" font-size="11" font-weight="600" fill="#888" stroke="none">POST HISTORY</text>
    <rect x="80" y="620" width="1280" height="60" rx="14" fill="#f8f8f8" stroke="#bbb"/>
    <text x="110" y="650" font-size="13" fill="#222" stroke="none">I fused Marketing with Python. Six weeks later...</text>
    <text x="110" y="668" font-size="10" fill="#aaa" stroke="none">Shipped the component library - Warm</text>
    <rect x="1240" y="638" width="60" height="22" rx="11" fill="#222" stroke="none"/>
    <text x="1270" y="653" text-anchor="middle" font-size="10" font-weight="600" fill="#fff" stroke="none">Shared</text>
    <rect x="80" y="690" width="1280" height="60" rx="14" fill="#f8f8f8" stroke="#bbb"/>
    <text x="110" y="720" font-size="13" fill="#222" stroke="none">The roadmap didn't feel like a course...</text>
    <rect x="1240" y="708" width="60" height="22" rx="11" fill="#f0f0f0" stroke="#ccc"/>
    <text x="1270" y="723" text-anchor="middle" font-size="10" fill="#222" stroke="none">Draft</text>

    <text x="40" y="960" font-size="11" fill="#999" stroke="none">[Posts] Entry list + draft editor with tone picker + post history</text>
  </g>
</svg>
