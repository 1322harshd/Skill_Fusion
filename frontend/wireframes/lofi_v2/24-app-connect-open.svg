<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100">
  <g font-family="Helvetica, Arial, sans-serif" fill="none" stroke="#222" stroke-width="1.2">
    <rect width="1440" height="1100" fill="#fff"/>
    <text x="80" y="80" font-size="36" font-style="italic" font-weight="800" fill="#222" stroke="none">Connect</text>
    <!-- Room tabs -->
    <rect x="80" y="110" width="130" height="40" rx="20" fill="#222" stroke="none"/>
    <text x="145" y="135" text-anchor="middle" font-size="13" font-weight="600" fill="#fff" stroke="none">Open room</text>
    <rect x="220" y="110" width="140" height="40" rx="20" fill="#f0f0f0" stroke="#bbb"/>
    <text x="290" y="135" text-anchor="middle" font-size="13" fill="#222" stroke="none">Private room</text>

    <!-- Room card -->
    <rect x="80" y="180" width="1280" height="600" rx="24" fill="#f8f8f8" stroke="#bbb"/>
    <!-- Room header with video bg placeholder -->
    <rect x="80" y="180" width="1280" height="140" rx="24" fill="#e0e0e0" stroke="none"/>
    <text x="120" y="230" font-size="11" font-weight="600" fill="#888" stroke="none">OPEN ROOM - LIVE NOW</text>
    <text x="120" y="265" font-size="24" font-style="italic" font-weight="700" fill="#222" stroke="none">The fusion lounge</text>
    <rect x="500" y="248" width="80" height="24" rx="12" fill="#f0f0f0" stroke="#ccc"/>
    <text x="540" y="265" text-anchor="middle" font-size="11" fill="#222" stroke="none">6 here</text>

    <!-- Presence avatars -->
    <rect x="80" y="330" width="1280" height="80" fill="#fff" stroke="none"/>
    <circle cx="140" cy="360" r="20" fill="#e0e0e0" stroke="#999"/>
    <text x="140" y="366" text-anchor="middle" font-size="10" font-weight="700" fill="#222" stroke="none">JR</text>
    <text x="140" y="395" text-anchor="middle" font-size="10" fill="#222" stroke="none">jordan.r</text>
    <circle cx="220" cy="360" r="20" fill="#e0e0e0" stroke="#999"/>
    <text x="220" y="366" text-anchor="middle" font-size="10" font-weight="700" fill="#222" stroke="none">ML</text>
    <text x="220" y="395" text-anchor="middle" font-size="10" fill="#222" stroke="none">maya.l</text>
    <circle cx="300" cy="360" r="20" fill="#e0e0e0" stroke="#999"/>
    <text x="300" y="366" text-anchor="middle" font-size="10" font-weight="700" fill="#222" stroke="none">KS</text>
    <text x="300" y="395" text-anchor="middle" font-size="10" fill="#222" stroke="none">kai.s</text>
    <circle cx="380" cy="360" r="20" fill="#e0e0e0" stroke="#999"/>
    <text x="380" y="366" text-anchor="middle" font-size="10" font-weight="700" fill="#222" stroke="none">AP</text>
    <text x="380" y="395" text-anchor="middle" font-size="10" fill="#222" stroke="none">aria.p</text>

    <!-- Chat messages -->
    <rect x="120" y="430" width="400" height="50" rx="16" fill="#f0f0f0" stroke="#ccc"/>
    <text x="140" y="455" font-size="10" fill="#888" stroke="none">jordan.r</text>
    <text x="140" y="470" font-size="13" fill="#222" stroke="none">Anyone fused design + data yet?</text>

    <rect x="760" y="500" width="400" height="50" rx="16" fill="#222" stroke="none"/>
    <text x="780" y="525" font-size="10" fill="#aaa" stroke="none">you</text>
    <text x="780" y="540" font-size="13" fill="#fff" stroke="none">Yeah! The overlap is huge in UX research</text>

    <rect x="120" y="570" width="350" height="50" rx="16" fill="#f0f0f0" stroke="#ccc"/>
    <text x="140" y="595" font-size="10" fill="#888" stroke="none">maya.l</text>
    <text x="140" y="610" font-size="13" fill="#222" stroke="none">The roadmap for that combo is fire</text>

    <!-- Typing indicator -->
    <text x="120" y="660" font-size="11" fill="#aaa" stroke="none">kai.s is typing...</text>

    <!-- Message input -->
    <rect x="120" y="690" width="1080" height="48" rx="24" fill="#f0f0f0" stroke="#bbb"/>
    <text x="140" y="720" font-size="13" fill="#aaa" stroke="none">Drop a note for the room...</text>
    <rect x="1220" y="690" width="100" height="48" rx="24" fill="#e0e0e0" stroke="#aaa"/>
    <text x="1270" y="720" text-anchor="middle" font-size="13" font-weight="600" fill="#222" stroke="none">Send</text>

    <text x="40" y="1060" font-size="11" fill="#999" stroke="none">[Connect Open] Room header + presence avatars + chat bubbles + input</text>
  </g>
</svg>
