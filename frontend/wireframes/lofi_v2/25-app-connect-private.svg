<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <g font-family="Helvetica, Arial, sans-serif" fill="none" stroke="#222" stroke-width="1.2">
    <rect width="1440" height="900" fill="#fff"/>
    <text x="80" y="80" font-size="36" font-style="italic" font-weight="800" fill="#222" stroke="none">Connect</text>
    <!-- Room tabs -->
    <rect x="80" y="110" width="130" height="40" rx="20" fill="#f0f0f0" stroke="#bbb"/>
    <text x="145" y="135" text-anchor="middle" font-size="13" fill="#222" stroke="none">Open room</text>
    <rect x="220" y="110" width="140" height="40" rx="20" fill="#222" stroke="none"/>
    <text x="290" y="135" text-anchor="middle" font-size="13" font-weight="600" fill="#fff" stroke="none">Private room</text>

    <!-- Centered content -->
    <rect x="320" y="200" width="800" height="400" rx="24" fill="#f0f0f0" stroke="#bbb"/>
    <!-- Badge -->
    <rect x="540" y="230" width="360" height="30" rx="15" fill="#e0e0e0" stroke="#ccc"/>
    <text x="720" y="250" text-anchor="middle" font-size="11" font-weight="600" fill="#222" stroke="none">Private room - one-on-one</text>
    <text x="720" y="290" text-anchor="middle" font-size="13" fill="#888" stroke="none">Sparse by design. One conversation, no audience.</text>

    <!-- Peer card -->
    <rect x="400" y="330" width="640" height="80" rx="16" fill="#fff" stroke="#ddd"/>
    <circle cx="450" cy="370" r="22" fill="#e0e0e0" stroke="#999"/>
    <text x="450" y="376" text-anchor="middle" font-size="11" font-weight="700" fill="#222" stroke="none">JR</text>
    <text x="485" y="365" font-size="16" font-style="italic" font-weight="600" fill="#222" stroke="none">jordan.r</text>
    <text x="485" y="385" font-size="11" fill="#888" stroke="none">Design x Code</text>
    <circle cx="1000" cy="370" r="16" fill="#f0f0f0" stroke="#ccc"/>
    <text x="1000" y="375" text-anchor="middle" font-size="14" fill="#888" stroke="none">...</text>

    <!-- Exchange panel -->
    <rect x="400" y="430" width="640" height="140" rx="16" fill="#fff" stroke="#ddd"/>
    <rect x="440" y="460" width="400" height="5" rx="2.5" fill="#ddd" stroke="none"/>
    <rect x="440" y="475" width="350" height="5" rx="2.5" fill="#ddd" stroke="none"/>
    <rect x="440" y="530" width="200" height="40" rx="20" fill="#222" stroke="none"/>
    <text x="540" y="555" text-anchor="middle" font-size="13" font-weight="600" fill="#fff" stroke="none">Propose exchange</text>

    <text x="40" y="860" font-size="11" fill="#999" stroke="none">[Connect Private] Private room badge + peer card + exchange panel</text>
  </g>
</svg>
