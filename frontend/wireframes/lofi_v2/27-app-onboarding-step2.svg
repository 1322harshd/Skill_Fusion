<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <g font-family="Helvetica, Arial, sans-serif" fill="none" stroke="#222" stroke-width="1.2">
    <rect width="1440" height="900" fill="#fff"/>
    <!-- Step dots -->
    <circle cx="680" cy="80" r="16" fill="#222" stroke="none"/>
    <text x="680" y="85" text-anchor="middle" font-size="12" font-weight="600" fill="#fff" stroke="none">1</text>
    <line x1="700" y1="80" x2="730" y2="80" stroke="#222" stroke-width="1.5"/>
    <circle cx="746" cy="80" r="16" fill="#222" stroke="none"/>
    <text x="746" y="85" text-anchor="middle" font-size="12" font-weight="600" fill="#fff" stroke="none">2</text>
    <line x1="766" y1="80" x2="796" y2="80" stroke="#ddd" stroke-width="1.5"/>
    <circle cx="812" cy="80" r="16" fill="#f0f0f0" stroke="#ccc"/>
    <text x="812" y="85" text-anchor="middle" font-size="12" fill="#aaa" stroke="none">3</text>

    <!-- Heading -->
    <text x="720" y="180" text-anchor="middle" font-size="36" font-style="italic" font-weight="800" fill="#222" stroke="none">How do we read your baseline?</text>
    <text x="720" y="215" text-anchor="middle" font-size="14" fill="#888" stroke="none">We calibrate your skill levels from real evidence - or from five quick questions.</text>

    <!-- Option cards -->
    <rect x="320" y="270" width="360" height="160" rx="20" fill="#f8f8f8" stroke="#bbb"/>
    <text x="360" y="320" font-size="16" font-weight="600" fill="#222" stroke="none">Upload a resume or GitHub</text>
    <text x="360" y="350" font-size="13" fill="#888" stroke="none">We read what you've already built and done.</text>

    <rect x="760" y="270" width="360" height="160" rx="20" fill="#222" stroke="none"/>
    <text x="800" y="320" font-size="16" font-weight="600" fill="#fff" stroke="none">Skip - quick quizzes</text>
    <text x="800" y="350" font-size="13" fill="#aaa" stroke="none">A five-minute read of your current level.</text>
    <text x="1080" y="320" font-size="16" fill="#fff" stroke="none">+</text>

    <!-- Continue button -->
    <rect x="560" y="500" width="320" height="50" rx="25" fill="#222" stroke="none"/>
    <text x="720" y="531" text-anchor="middle" font-size="15" font-weight="600" fill="#fff" stroke="none">Continue</text>

    <text x="40" y="860" font-size="11" fill="#999" stroke="none">[Onboarding Step 2] Step dots + baseline method selection</text>
  </g>
</svg>
