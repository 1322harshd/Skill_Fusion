  <style>
    :root {
      /* Category colors are sourced from fusion.js CATEGORY_COLORS at
         runtime (setProperty) — keep them in sync here only as fallback. */
      --color-tech: #3fb6c6;
      --color-creative: #d96c92;
      --color-business: #cda62f;
      --color-science: #52a970;
      --color-comm: #7d84ce;
      --color-status-active: #4fb98a;
      --color-status-typing: #cda62f;
      --color-status-idle: rgba(255, 255, 255, 0.5);
      --color-status-away: rgba(255, 255, 255, 0.15);
      --color-paper: #f2efe8;
      --shadow-paper: 0 24px 80px rgba(0, 0, 0, 0.5);
      --node-done: #ffffff;
      --node-active: #ffffff;
      --node-idle: rgba(255, 255, 255, 0.22);
      --node-ring: rgba(255, 255, 255, 0.14);
      --node-glow: rgba(255, 255, 255, 0.5);
      --cell-on: rgba(255, 255, 255, 0.55);
      --cell-off: rgba(255, 255, 255, 0.08);
      --radius-sm: 0.375rem;
      --radius-md: 0.75rem;
      --radius-lg: 1rem;
      --radius-pill: 9999px;
      --glass-surface: rgba(255, 255, 255, 0.01);
      --glass-strong: rgba(255, 255, 255, 0.04);
      --border-subtle: rgba(255, 255, 255, 0.1);
    }

    .liquid-glass {
      background: var(--glass-surface);
      background-blend-mode: luminosity;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }
    .liquid-glass::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg,
        rgba(255, 255, 255, 0.45) 0%,
        rgba(255, 255, 255, 0.15) 20%,
        rgba(255, 255, 255, 0) 40%,
        rgba(255, 255, 255, 0) 60%,
        rgba(255, 255, 255, 0.15) 80%,
        rgba(255, 255, 255, 0.45) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
    .liquid-glass-strong {
      background: rgba(255, 255, 255, 0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(50px);
      -webkit-backdrop-filter: blur(50px);
      border: none;
      box-shadow: 4px 4px 4px rgba(0, 0, 0, 0.05), inset 0 1px 1px rgba(255, 255, 255, 0.15);
      position: relative;
      overflow: hidden;
    }
    .liquid-glass-strong::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg,
        rgba(255, 255, 255, 0.5) 0%,
        rgba(255, 255, 255, 0.2) 20%,
        rgba(255, 255, 255, 0) 40%,
        rgba(255, 255, 255, 0) 60%,
        rgba(255, 255, 255, 0.2) 80%,
        rgba(255, 255, 255, 0.5) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
    body {
      margin: 0;
    }
    html {
      scroll-behavior: smooth;
    }

    :focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.75);
      outline-offset: 2px;
      border-radius: 9999px;
    }

    .tappable {
      transition: transform 160ms ease-out;
    }
    .tappable:active {
      transform: scale(0.97);
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }

    @media (prefers-reduced-transparency: reduce) {
      .liquid-glass {
        background: rgba(255, 255, 255, 0.06);
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }
      .liquid-glass-strong {
        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }
      :root {
        --cell-off: rgba(255, 255, 255, 0.12);
        --node-idle: rgba(255, 255, 255, 0.35);
      }
    }
  </style>
