<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <g font-family="Helvetica, Arial, sans-serif">
    <rect width="1280" height="640" fill="#FFFFFF"/>

    <!-- APP SHELL HEADER -->
    <circle cx="56" cy="52" r="24" fill="#FFFFFF" stroke="#1F1F1F" stroke-width="1.3"/>
    <text x="56" y="60" text-anchor="middle" font-size="20" font-style="italic" font-weight="800" fill="#1F1F1F">s</text>
    <rect x="320" y="30" width="640" height="46" rx="23" fill="#F4F4F4"/>
    <rect x="330" y="34" width="100" height="38" rx="19" fill="#FFFFFF"/>
    <rect x="343" y="46" width="14" height="14" rx="4" fill="none" stroke="#1F1F1F" stroke-width="1.2"/><text x="365" y="58" font-size="13" fill="#1F1F1F">Dashboard</text>
    <rect x="436" y="34" width="100" height="38" rx="19" fill="#1F1F1F"/>
    <rect x="449" y="46" width="14" height="14" rx="4" fill="#FFFFFF"/>
    <text x="471" y="58" font-size="13" font-weight="600" fill="#FFFFFF">Fuse</text>
    <rect x="452" y="46" width="14" height="14" rx="4" fill="none" stroke="#1F1F1F" stroke-width="1.2"/><text x="474" y="58" font-size="13" fill="#1F1F1F">Roadmaps</text>
    <rect x="558" y="46" width="14" height="14" rx="4" fill="none" stroke="#1F1F1F" stroke-width="1.2"/><text x="580" y="58" font-size="13" fill="#1F1F1F">Log</text>
    <rect x="664" y="46" width="14" height="14" rx="4" fill="none" stroke="#1F1F1F" stroke-width="1.2"/><text x="686" y="58" font-size="13" fill="#1F1F1F">Resume</text>
    <rect x="770" y="46" width="14" height="14" rx="4" fill="none" stroke="#1F1F1F" stroke-width="1.2"/><text x="792" y="58" font-size="13" fill="#1F1F1F">Connect</text>
    <rect x="1112" y="30" width="128" height="46" rx="23" fill="#F4F4F4"/>
    <circle cx="1138" cy="53" r="17" fill="#D9D9D9"/>
    <text x="1164" y="58" font-size="13" font-weight="600" fill="#1F1F1F">Ada</text>

    <!-- Title -->
    <text x="640" y="185" text-anchor="middle" font-size="44" font-style="italic" font-weight="800" fill="#1F1F1F">Fuse any two skills</text>

    <!-- Skill one -->
    <text x="412" y="238" font-size="11" font-weight="700" letter-spacing="1.5" fill="#666666">SKILL ONE</text>
    <rect x="384" y="250" width="512" height="54" rx="27" fill="#F7F7F7" stroke="#1F1F1F" stroke-width="1.2"/>
    <text x="412" y="283" font-size="14" fill="#888888">Pick a skill from any domain</text>
    <circle cx="616" cy="280" r="4" fill="#1F1F1F"/>

    <!-- Fusion orb -->
    <circle cx="640" cy="336" r="30" fill="#FFFFFF" stroke="#1F1F1F" stroke-width="1.6"/>
    <text x="640" y="345" text-anchor="middle" font-size="24" font-weight="800" fill="#1F1F1F">×</text>

    <!-- Skill two -->
    <text x="412" y="392" font-size="11" font-weight="700" letter-spacing="1.5" fill="#666666">SKILL TWO</text>
    <rect x="384" y="404" width="512" height="54" rx="27" fill="#F7F7F7" stroke="#1F1F1F" stroke-width="1.2"/>
    <text x="412" y="437" font-size="14" fill="#888888">Pick another skill from any domain</text>

    <!-- Fuse button -->
    <rect x="560" y="492" width="170" height="48" rx="24" fill="#1F1F1F"/>
    <text x="645" y="522" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">Fuse two skills</text>
  </g>
