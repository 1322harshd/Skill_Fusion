    <rect x="1112" y="30" width="128" height="46" rx="23" fill="#F4F4F4"/>
    <circle cx="1138" cy="53" r="17" fill="#D9D9D9"/>
    <text x="1164" y="58" font-size="13" font-weight="600" fill="#1F1F1F">Ada</text>

    <!-- Result header -->
    <text x="128" y="158" font-size="11" font-weight="700" letter-spacing="1.5" fill="#666666">YOUR FUSION</text>
    <text x="128" y="212" font-size="42" font-style="italic" font-weight="800" fill="#1F1F1F">Design <tspan fill="#999999">×</tspan> AI</text>
    <text x="1152" y="205" text-anchor="end" font-size="58" font-style="italic" font-weight="800" fill="#1F1F1F">78</text>
    <text x="1152" y="236" text-anchor="end" font-size="12" fill="#666666">Rare rarity · High demand</text>

    <!-- Lede -->
    <text x="128" y="284" font-size="14" fill="#333333">Design × AI is a rare, high-demand blend: you pair taste, craft and systems thinking with the ability to build</text>
    <text x="128" y="304" font-size="14" fill="#333333">intelligent products — a profile teams increasingly hunt for.</text>

    <!-- 2x2 cards -->
    <rect x="128" y="340" width="520" height="150" rx="20" fill="#F7F7F7" stroke="#1F1F1F" stroke-width="1.2"/>
    <text x="156" y="370" font-size="11" font-weight="700" letter-spacing="1.5" fill="#666666">COMPLEMENTARITY</text>
    <circle cx="162" cy="396" r="3" fill="#1F1F1F"/><text x="176" y="400" font-size="13" fill="#333333">Design systems meet model capabilities</text>
    <circle cx="162" cy="422" r="3" fill="#1F1F1F"/><text x="176" y="426" font-size="13" fill="#333333">Rapid prototyping with generative tools</text>

    <rect x="664" y="340" width="488" height="150" rx="20" fill="#F7F7F7" stroke="#1F1F1F" stroke-width="1.2"/>
