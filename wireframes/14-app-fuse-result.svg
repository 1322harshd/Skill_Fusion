    <circle cx="698" cy="396" r="3" fill="#1F1F1F"/><text x="712" y="400" font-size="13" fill="#333333">AI product designer roles</text>
    <circle cx="698" cy="422" r="3" fill="#1F1F1F"/><text x="712" y="426" font-size="13" fill="#333333">Design engineer at AI tools startups</text>
    <circle cx="698" cy="448" r="3" fill="#1F1F1F"/><text x="712" y="452" font-size="13" fill="#333333">UX engineer + applied AI teams</text>

    <rect x="128" y="506" width="520" height="150" rx="20" fill="#F7F7F7" stroke="#1F1F1F" stroke-width="1.2"/>
    <text x="156" y="536" font-size="11" font-weight="700" letter-spacing="1.5" fill="#666666">INDUSTRIES</text>
    <g>
      <rect x="156" y="556" width="86" height="26" rx="13" fill="#F1F1F1" stroke="#1F1F1F" stroke-width="0.8"/><text x="199" y="573" text-anchor="middle" font-size="11" fill="#1F1F1F">Tech</text>
      <rect x="250" y="556" width="130" height="26" rx="13" fill="#F1F1F1" stroke="#1F1F1F" stroke-width="0.8"/><text x="315" y="573" text-anchor="middle" font-size="11" fill="#1F1F1F">SaaS</text>
      <rect x="388" y="556" width="112" height="26" rx="13" fill="#F1F1F1" stroke="#1F1F1F" stroke-width="0.8"/><text x="444" y="573" text-anchor="middle" font-size="11" fill="#1F1F1F">AI labs</text>
      <rect x="156" y="590" width="150" height="26" rx="13" fill="#F1F1F1" stroke="#1F1F1F" stroke-width="0.8"/><text x="231" y="607" text-anchor="middle" font-size="11" fill="#1F1F1F">Creative agencies</text>
    </g>

    <rect x="664" y="506" width="488" height="150" rx="20" fill="#F7F7F7" stroke="#1F1F1F" stroke-width="1.2"/>
    <text x="692" y="536" font-size="11" font-weight="700" letter-spacing="1.5" fill="#666666">INSIGHTS</text>
    <circle cx="698" cy="562" r="3" fill="#1F1F1F"/><text x="712" y="566" font-size="13" fill="#333333">30% pay premium over design alone</text>
    <circle cx="698" cy="588" r="3" fill="#1F1F1F"/><text x="712" y="592" font-size="13" fill="#333333">Demand growing ~ 4.1% / yr</text>

    <!-- Actions -->
    <rect x="128" y="706" width="190" height="46" rx="23" fill="#1F1F1F"/>
    <text x="223" y="733" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">Choose a roadmap</text>
    <rect x="332" y="706" width="150" height="46" rx="23" fill="#FFFFFF" stroke="#1F1F1F" stroke-width="1.2"/>
    <text x="407" y="733" text-anchor="middle" font-size="14" fill="#1F1F1F">See the score</text>
    <text x="506" y="733" font-size="14" fill="#1F1F1F">Fuse a new pair</text>

    <text x="128" y="800" font-size="12" fill="#888888">[Fuse — result] Brief cards populated by the fusion engine</text>
  </g>
</svg>