    <text x="1088" y="462" text-anchor="end" font-size="18" font-style="italic" font-weight="800" fill="#1F1F1F">High</text>
    <rect x="560" y="480" width="528" height="8" rx="4" fill="#E3E3E3"/>
    <rect x="560" y="480" width="424" height="8" rx="4" fill="#1F1F1F"/>
    <text x="560" y="512" font-size="13" fill="#444444">Postings asking for design + AI grew ~4.1% per year over 18 months.</text>

    <line x1="560" y1="548" x2="1088" y2="548" stroke="#DDDDDD" stroke-width="1"/>
    <text x="560" y="580" font-size="13" fill="#444444">Combined, your blend sits above 78% of tracked skill pairs — a strong,</text>
    <text x="560" y="600" font-size="13" fill="#444444">defensible niche worth leaning into.</text>

    <!-- Natural next step -->
    <rect x="192" y="650" width="896" height="100" rx="24" fill="#F7F7F7" stroke="#1F1F1F" stroke-width="1.2"/>
    <text x="228" y="688" font-size="11" font-weight="700" letter-spacing="1.5" fill="#666666">NATURAL NEXT STEP</text>
    <text x="228" y="724" font-size="20" font-style="italic" font-weight="800" fill="#1F1F1F">Add Design Eng. to lift your score to 90</text>
    <rect x="856" y="672" width="200" height="46" rx="23" fill="#1F1F1F"/>
    <text x="930" y="700" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">Add Design Eng.</text>
    <rect x="1020" y="684" width="44" height="22" rx="11" fill="#FFFFFF"/>
    <text x="1042" y="699" text-anchor="middle" font-size="12" font-weight="700" fill="#1F1F1F">+12</text>

    <!-- Score history -->
    <rect x="192" y="780" width="896" height="160" rx="24" fill="#F7F7F7" stroke="#1F1F1F" stroke-width="1.2"/>
    <text x="228" y="812" font-size="11" font-weight="700" letter-spacing="1.5" fill="#666666">SCORE HISTORY</text>
    <polyline points="256,900 320,884 384,890 448,872 512,878 576,860 640,866 704,856 768,862 832,846 896,852 960,838 1024,844 1052,838" fill="none" stroke="#1F1F1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1052" cy="838" r="4" fill="#1F1F1F"/>
    <text x="256" y="926" font-size="11" fill="#888888">6 weeks ago</text>
    <text x="1052" y="926" text-anchor="end" font-size="11" fill="#888888">today</text>
