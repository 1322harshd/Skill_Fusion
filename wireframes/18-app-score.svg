    <text x="1164" y="58" font-size="13" font-weight="600" fill="#1F1F1F">Ada</text>

    <!-- Header -->
    <rect x="192" y="140" width="78" height="30" rx="15" fill="#1F1F1F"/><text x="231" y="160" text-anchor="middle" font-size="13" fill="#FFFFFF">Design</text>
    <text x="280" y="160" text-anchor="middle" font-size="15" fill="#999999">×</text>
    <rect x="298" y="140" width="44" height="30" rx="15" fill="#1F1F1F"/><text x="320" y="160" text-anchor="middle" font-size="13" fill="#FFFFFF">AI</text>
    <text x="192" y="212" font-size="38" font-style="italic" font-weight="800" fill="#1F1F1F">Fusion Score</text>

    <!-- fusion filter chips -->
    <rect x="192" y="240" width="110" height="30" rx="15" fill="#1F1F1F"/><text x="247" y="260" text-anchor="middle" font-size="12" fill="#FFFFFF">Design × AI</text>
    <rect x="312" y="240" width="120" height="30" rx="15" fill="#F4F4F4" stroke="#1F1F1F" stroke-width="1"/><text x="372" y="260" text-anchor="middle" font-size="12" fill="#1F1F1F">Data × Writing</text>

    <!-- Gauge -->
    <circle cx="340" cy="420" r="88" fill="none" stroke="#DDDDDD" stroke-width="16"/>
    <path d="M 340 332 A 88 88 0 0 1 414 478" fill="none" stroke="#1F1F1F" stroke-width="16" stroke-linecap="round"/>
    <circle cx="340" cy="420" r="72" fill="#FFFFFF"/>
    <text x="340" y="428" text-anchor="middle" font-size="52" font-style="italic" font-weight="800" fill="#1F1F1F">78</text>
    <text x="340" y="452" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="2" fill="#666666">SCORE</text>
    <text x="340" y="552" text-anchor="middle" font-size="12" fill="#666666">weights: rarity 45% · demand 55%</text>

    <!-- Signal bars -->
