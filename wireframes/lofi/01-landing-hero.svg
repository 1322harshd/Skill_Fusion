<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <g font-family="Helvetica, Arial, sans-serif">
    <rect width="1440" height="900" fill="#FFFFFF"/>

    <!-- Dark header bg -->
    <rect width="1440" height="120" fill="#2A2A2A"/>

    <!-- Logo placeholder -->
    <rect x="60" y="35" width="50" height="50" rx="25" fill="#3A3A3A" stroke="#666" stroke-width="1.5"/>
    <text x="85" y="68" text-anchor="middle" font-size="24" font-style="italic" font-weight="800" fill="#FFF">s</text>

    <!-- Nav links -->
    <text x="320" y="68" font-size="14" fill="#AAA">Home</text>
    <text x="440" y="68" font-size="14" fill="#AAA">How It Works</text>
    <text x="590" y="68" font-size="14" fill="#AAA">Features</text>
    <text x="710" y="68" font-size="14" fill="#AAA">Community</text>
    <text x="830" y="68" font-size="14" fill="#AAA">Pricing</text>

    <!-- CTA button -->
    <rect x="1200" y="42" width="180" height="42" rx="21" fill="#FFF"/>
    <text x="1290" y="68" text-anchor="middle" font-size="14" font-weight="600" fill="#1F1F1F">Start Fusing</text>

    <!-- Announcement pill -->
    <rect x="530" y="160" width="420" height="36" rx="18" fill="#F0F0F0" stroke="#CCC" stroke-width="1"/>
    <rect x="542" y="168" width="50" height="20" rx="10" fill="#1F1F1F"/>
    <text x="567" y="182" text-anchor="middle" font-size="11" font-weight="700" fill="#FFF">NEW</text>
    <text x="604" y="182" font-size="12" fill="#555">Fusion Score Is Now Live — See Where You Rank</text>

    <!-- Main headline -->
    <text x="720" y="260" text-anchor="middle" font-size="48" font-style="italic" font-weight="800" fill="#1F1F1F">Fuse What You Know</text>
    <text x="720" y="315" text-anchor="middle" font-size="48" font-style="italic" font-weight="800" fill="#1F1F1F">Into What You'll Become</text>

    <!-- Subtitle -->
    <text x="720" y="365" text-anchor="middle" font-size="15" fill="#555">Combine any two skills and our AI builds your personalized roadmap,</text>
    <text x="720" y="385" text-anchor="middle" font-size="15" fill="#555">a real project, and a data-backed score of how rare your combination is.</text>

    <!-- CTA buttons -->
    <rect x="530" y="420" width="200" height="48" rx="24" fill="#1F1F1F"/>
    <text x="630" y="450" text-anchor="middle" font-size="14" font-weight="600" fill="#FFF">Start Your Fusion</text>
    <text x="810" y="450" text-anchor="middle" font-size="14" fill="#1F1F1F">See How It Works</text>

    <!-- Stat cards -->
    <rect x="390" y="500" width="310" height="130" rx="18" fill="#FFF" stroke="#1F1F1F" stroke-width="1.5"/>
    <rect x="415" y="525" width="30" height="30" rx="8" fill="#E5E5E5"/>
    <text x="415" y="600" font-size="32" font-style="italic" font-weight="800" fill="#1F1F1F">12,000+</text>
    <text x="415" y="620" font-size="12" fill="#666">Real Job Listings Analyzed</text>

    <rect x="740" y="500" width="310" height="130" rx="18" fill="#FFF" stroke="#1F1F1F" stroke-width="1.5"/>
    <rect x="765" y="525" width="30" height="30" rx="8" fill="#E5E5E5"/>
    <text x="765" y="600" font-size="32" font-style="italic" font-weight="800" fill="#1F1F1F">4–12 Wk</text>
    <text x="765" y="620" font-size="12" fill="#666">Personalized Roadmaps</text>

    <!-- Trust strip -->
    <rect x="540" y="670" width="360" height="30" rx="15" fill="#F0F0F0"/>
    <text x="720" y="690" text-anchor="middle" font-size="11" fill="#888">Grounded in real infrastructure, not vibes</text>

    <!-- Partner logos -->
    <text x="460" y="750" text-anchor="middle" font-size="20" font-style="italic" font-weight="700" fill="#1F1F1F">Adzuna</text>
    <text x="600" y="750" text-anchor="middle" font-size="20" font-style="italic" font-weight="700" fill="#1F1F1F">GitHub</text>
    <text x="720" y="750" text-anchor="middle" font-size="20" font-style="italic" font-weight="700" fill="#1F1F1F">Ollama</text>
    <text x="850" y="750" text-anchor="middle" font-size="20" font-style="italic" font-weight="700" fill="#1F1F1F">PostgreSQL</text>
    <text x="1000" y="750" text-anchor="middle" font-size="20" font-style="italic" font-weight="700" fill="#1F1F1F">Open Source</text>

    <!-- Lofi note -->
    <text x="60" y="870" font-size="11" fill="#999">[LOFI] Hero — dark header, headline, two stat cards, trust strip, partner logos</text>
  </g>
</svg>
