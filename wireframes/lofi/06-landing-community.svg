<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <g font-family="Helvetica, Arial, sans-serif">
    <rect width="1440" height="900" fill="#FFFFFF"/>

    <!-- Section heading -->
    <text x="100" y="80" font-size="48" font-style="italic" font-weight="800" fill="#1F1F1F">Built by people fusing now</text>

    <!-- Badge pills -->
    <rect x="100" y="110" width="110" height="28" rx="14" fill="#F0F0F0" stroke="#CCC" stroke-width="1"/>
    <text x="155" y="129" text-anchor="middle" font-size="11" fill="#555">GitHub Synced</text>
    <rect x="225" y="110" width="100" height="28" rx="14" fill="#F0F0F0" stroke="#CCC" stroke-width="1"/>
    <text x="275" y="129" text-anchor="middle" font-size="11" fill="#555">Dual-Tagged</text>
    <rect x="340" y="110" width="120" height="28" rx="14" fill="#F0F0F0" stroke="#CCC" stroke-width="1"/>
    <text x="400" y="129" text-anchor="middle" font-size="11" fill="#555">Portfolio-Ready</text>
    <rect x="475" y="110" width="110" height="28" rx="14" fill="#F0F0F0" stroke="#CCC" stroke-width="1"/>
    <text x="530" y="129" text-anchor="middle" font-size="11" fill="#555">Verified Badges</text>

    <!-- Quote cards -->
    <!-- Card 1 -->
    <rect x="100" y="180" width="380" height="280" rx="16" fill="#FFF" stroke="#1F1F1F" stroke-width="1.5"/>
    <text x="130" y="230" font-size="14" fill="#444">"I fused Marketing with Python. Six</text>
    <text x="130" y="250" font-size="14" fill="#444">weeks later I shipped a market-analysis</text>
    <text x="130" y="270" font-size="14" fill="#444">tool that got me three interviews."</text>
    <rect x="130" y="390" width="36" height="36" rx="18" fill="#E5E5E5"/>
    <text x="148" y="414" text-anchor="middle" font-size="13" font-style="italic" font-weight="700" fill="#666">AO</text>
    <text x="180" y="408" font-size="13" font-weight="600" fill="#1F1F1F">Amara Osei</text>
    <text x="180" y="424" font-size="11" fill="#999">Marketing × Python</text>

    <!-- Card 2 -->
    <rect x="530" y="180" width="380" height="280" rx="16" fill="#FFF" stroke="#1F1F1F" stroke-width="1.5"/>
    <text x="560" y="230" font-size="14" fill="#444">"The roadmap didn't feel like a course.</text>
    <text x="560" y="250" font-size="14" fill="#444">It felt like a plan a senior would</text>
    <text x="560" y="270" font-size="14" fill="#444">actually give you."</text>
    <rect x="560" y="390" width="36" height="36" rx="18" fill="#E5E5E5"/>
    <text x="578" y="414" text-anchor="middle" font-size="13" font-style="italic" font-weight="700" fill="#666">DR</text>
    <text x="610" y="408" font-size="13" font-weight="600" fill="#1F1F1F">Daniel Reyes</text>
    <text x="610" y="424" font-size="11" fill="#999">Design × Code</text>

    <!-- Card 3 -->
    <rect x="960" y="180" width="380" height="280" rx="16" fill="#FFF" stroke="#1F1F1F" stroke-width="1.5"/>
    <text x="990" y="230" font-size="14" fill="#444">"Seeing my rarity score gave me real</text>
    <text x="990" y="250" font-size="14" fill="#444">confidence. 3.1% of pairs are this</text>
    <text x="990" y="270" font-size="14" fill="#444">rare — I lean into it now."</text>
    <rect x="990" y="390" width="36" height="36" rx="18" fill="#E5E5E5"/>
    <text x="1008" y="414" text-anchor="middle" font-size="13" font-style="italic" font-weight="700" fill="#666">PN</text>
    <text x="1040" y="408" font-size="13" font-weight="600" fill="#1F1F1F">Priya Nair</text>
    <text x="1040" y="424" font-size="11" fill="#999">Data × Writing</text>

    <text x="60" y="870" font-size="11" fill="#999">[LOFI] Community — badge pills, three testimonial quote cards with avatars</text>
  </g>
</svg>
