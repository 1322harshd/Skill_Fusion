<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <g font-family="Helvetica, Arial, sans-serif">
    <rect width="1440" height="900" fill="#FFFFFF"/>

    <!-- Top nav -->
    <rect width="1440" height="60" fill="#F8F8F8" stroke="#EEE" stroke-width="1"/>
    <circle cx="40" cy="30" r="18" fill="#E5E5E5"/>
    <text x="40" y="36" text-anchor="middle" font-size="14" font-style="italic" font-weight="800" fill="#666">s</text>
    <text x="200" y="36" font-size="13" fill="#999">Dashboard</text>
    <text x="320" y="36" font-size="13" font-weight="600" fill="#1F1F1F">Fuse</text>
    <text x="400" y="36" font-size="13" fill="#999">Roadmaps</text>
    <text x="510" y="36" font-size="13" fill="#999">Log</text>

    <!-- Title -->
    <text x="720" y="140" text-anchor="middle" font-size="42" font-style="italic" font-weight="800" fill="#1F1F1F">Fuse any two skills</text>

    <!-- Skill one picker -->
    <rect x="460" y="200" width="520" height="70" rx="14" fill="#FFF" stroke="#1F1F1F" stroke-width="1.5"/>
    <text x="490" y="230" font-size="11" fill="#999" letter-spacing="2">SKILL ONE</text>
    <text x="490" y="255" font-size="15" fill="#CCC">Pick a skill from any domain</text>

    <!-- Orb / merge icon -->
    <circle cx="720" cy="320" r="30" fill="#F0F0F0" stroke="#CCC" stroke-width="1"/>
    <text x="720" y="328" text-anchor="middle" font-size="22" font-weight="600" fill="#999">×</text>

    <!-- Skill two picker -->
    <rect x="460" y="380" width="520" height="70" rx="14" fill="#FFF" stroke="#1F1F1F" stroke-width="1.5"/>
    <text x="490" y="410" font-size="11" fill="#999" letter-spacing="2">SKILL TWO</text>
    <text x="490" y="435" font-size="15" fill="#CCC">Pick another skill from any domain</text>

    <!-- Fuse button -->
    <rect x="590" y="500" width="260" height="48" rx="24" fill="#F0F0F0" stroke="#CCC" stroke-width="1"/>
    <text x="720" y="530" text-anchor="middle" font-size="14" fill="#999">Fuse two skills</text>

    <text x="60" y="870" font-size="11" fill="#999">[LOFI] Fuse Input — two skill pickers, merge orb, fuse button</text>
  </g>
</svg>
